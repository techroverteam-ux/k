name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env: { POSTGRES_USER: tradedesk, POSTGRES_PASSWORD: tradedesk_dev, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U tradedesk" --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/api/package-lock.json }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - name: e2e tests (authz, idempotency, ledger invariants)
        run: |
          cat > .env.test <<ENV
          NODE_ENV=test
          DATABASE_URL=postgresql://tradedesk:tradedesk_dev@127.0.0.1:5432/tradedesk_test
          JWT_ACCESS_SECRET=$(openssl rand -base64 48)
          JWT_STEPUP_SECRET=$(openssl rand -base64 48)
          HASH_PEPPER=$(openssl rand -base64 48)
          DATA_ENCRYPTION_KEY=$(openssl rand -base64 32)
          SMS_PROVIDER=dev
          SEED_PASSWORD=Ci-Only-Passw0rd!
          THROTTLE_SCALE=20
          ENV
          npm test
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci && npm audit --omit=dev --audit-level=high && npm run typecheck && npm run build
  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/mobile/package-lock.json }
      - run: npm ci && npm run typecheck
