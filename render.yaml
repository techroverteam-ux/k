# Render Blueprint for The K API: Docker service built from apps/api/Dockerfile.
# The container runs migrations and (when SEED_PASSWORD is set and NODE_ENV isn't production) the
# idempotent demo seed at start-up, then starts the API on Render's PORT.
# Database: Neon DIRECT connection string (host without "-pooler") in DATABASE_URL.
#
# DEMO / staging deployment of a paper-trading build: NODE_ENV=development shows demo OTP codes on
# screen (no real SMS provider). No real money, no real orders. Use NODE_ENV=production only after a
# real SMS provider and a secrets manager are in place.
services:
  - type: web
    name: k-api
    runtime: docker
    plan: free
    region: ohio # same region as the Neon database (us-east-2)
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: development
      - key: APP_NAME
        value: The K
      - key: DATABASE_URL
        sync: false # Neon DIRECT string (no -pooler)
      - key: DB_POOL_MAX
        value: "5"
      - key: CORS_ORIGINS
        value: http://localhost:3000,http://localhost:8081
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_STEPUP_SECRET
        generateValue: true
      - key: HASH_PEPPER
        generateValue: true # never change it later, or phone/email lookups stop matching
      - key: DATA_ENCRYPTION_KEY
        sync: false # 32 bytes base64. Save a copy: losing it makes encrypted fields unreadable
      - key: DATA_ENCRYPTION_KEY_ID
        value: k1
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: SMS_PROVIDER
        value: dev
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: MARKET_FEED
        value: simulated
      - key: MARKET_HOURS
        value: always_open # demo only; use "config" for real NSE session hours
      - key: LOG_FORMAT
        value: json
      - key: LOG_ARCHIVE_DIR
        value: /tmp/log-archive
      - key: SEED_PASSWORD
        sync: false # demo account password, 12+ characters
